services:
  postgres:
    build: .
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureco -d futureco"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
