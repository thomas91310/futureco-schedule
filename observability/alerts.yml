groups:
  - name: futureco-schedule
    rules:
      - alert: FuturecoHTTPErrorRate
        expr: sum(rate(futureco_http_requests_total{status=~"5.."}[5m])) / sum(rate(futureco_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx ratio is above 1 percent
      - alert: FuturecoHTTPP99Latency
        expr: histogram_quantile(0.99, sum by (le) (rate(futureco_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP P99 latency is above 2 seconds
      - alert: FuturecoDBPoolSaturation
        expr: futureco_db_pool_acquired_connections / futureco_db_pool_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database pool is more than 90 percent acquired
